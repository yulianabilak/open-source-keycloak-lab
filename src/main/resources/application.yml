spring:
  application:
    name: open-source-keycloak-lab
  data:
    mongodb:
      host: localhost
      port: 27017
      database: open-source-db
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/spring-demo

keycloak:
  client-id: springboot-app